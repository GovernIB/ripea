spring.main.web-application-type=NONE

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.hql.bulk_id_strategy=org.hibernate.hql.spi.id.inline.InlineIdsOrClauseBulkIdStrategy
# Diagnostic de rendiment (TempsTraca): consultes SQL i temps de cada pas de les peticions a l'API.
# Nomes fan feina si la categoria de log es.caib.ripea.diag.temps esta a INFO.
spring.jpa.properties.hibernate.session.events.auto=es.caib.ripea.persistence.diag.TempsTracaSqlListener
spring.jpa.properties.hibernate.session_factory.statement_inspector=es.caib.ripea.persistence.diag.TempsTracaSqlInspector
spring.jpa.open-in-view=false
spring.datasource.initialization-mode=never
spring.thymeleaf.templateResolverOrder=1
spring.liquibase.enabled=false

spring.datasource.jndi-name=java:jboss/datasources/ripeaDS
spring.mail.jndi-name=java:jboss/mail/ripeaMailSession

logging.level.root=INFO
logging.level.org.reflections.Reflections=WARN