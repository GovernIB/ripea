# -------------------------------------------------------
# Configuració de tests amb H2 en mode Oracle (in-memory)
# -------------------------------------------------------

# Datasource H2
spring.datasource.url=jdbc:h2:mem:ripeadb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: generar l'esquema a partir de les entitats i esborrar-lo al final
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar Liquibase als tests (l'esquema el genera Hibernate)
spring.liquibase.enabled=false

# Logging SQL (útil per depurar tests, comentar si genera massa soroll)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
