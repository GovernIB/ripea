name: 🚀 Build RIPEA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '📦 Repository'
        default: 'GovernIB/ripea'
        required: true
      branch:
        description: '🌿 Branch'
        default: 'ripea-1.0-dev'
        required: true
      skip_tests:
        description: '🧪 Run tests'
        type: choice
        options: ['true', 'false']
        default: 'false'
      build_docker:
        description: '🐳 Build Docker image'
        type: choice
        options: ['true', 'false']
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔧 Set variables
        id: vars
        run: |
          TAG="manual-${{ inputs.branch }}-$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🌐 Clone repository
        run: |
          git clone --branch ${{ inputs.branch }} --depth 1 https://github.com/${{ inputs.repo }} ripea

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: 📄 Load .env variables
        working-directory: ripea
        run: |
          cp .env.example .env

          set -o allexport
          source .env
          set +o allexport

          # Export to GitHub environment
          while IFS= read -r line; do
            if [[ "$line" != "" && "$line" != \#* ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .env

      - name: 🧱 Build EAR
        working-directory: ripea
        run: |
          mvn -B clean package \
            -DskipTests=${{ inputs.skip_tests }}

      - name: 📦 Upload EAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "RIPEA EAR ${{ steps.vars.outputs.tag }}"
          body: "EAR build for branch ${{ inputs.branch }}"
          files: ripea/target/*.ear
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Docker (Fabric8)
        if: ${{ inputs.build_docker == 'true' }}
        working-directory: ripea
        env:
          DOCKER_IMAGE_FROM: ${{ secrets.DOCKER_IMAGE_FROM }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER_GROUP: ${{ secrets.DOCKER_USER_GROUP }}
        run: |
          mvn docker:build

      - name: 🔐 Login to private Quay
        if: ${{ inputs.build_docker == 'true' }}
        env:
          QUAY_URL: ${{ secrets.QUAY_URL }}
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | docker login $QUAY_URL -u "$QUAY_USER" --password-stdin

      - name: 📤 Push Docker to private Quay
        if: ${{ inputs.build_docker == 'true' }}
        env:
          QUAY_URL: ${{ secrets.QUAY_URL }}
          QUAY_REPO: ${{ secrets.QUAY_REPO }}
        run: |
          docker tag ripea:latest $QUAY_REPO:${{ steps.vars.outputs.tag }}
          docker push $QUAY_REPO:${{ steps.vars.outputs.tag }}