name: 🚀 Build RIPEA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '📦 Repository'
        default: 'GovernIB/ripea'
        required: true
      branch:
        description: '🌿 Branch'
        default: 'ripea-1.0-dev'
        required: true
      run_tests:
        description: '🧪 Run tests'
        type: boolean
        default: false
      build_docker:
        description: '🐳 Build Docker image'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔧 Set variables
        id: vars
        run: |
          TAG="manual-${{ inputs.branch }}-$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🌐 Clone repository
        run: |
          git clone --branch ${{ inputs.branch }} --depth 1 https://github.com/${{ inputs.repo }} ripea

      - name: 🏷️ Get package version
        id: package_version
        working-directory: ripea
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f ripea-ear/pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: 📄 Load .env variables
        working-directory: ripea
        run: |
          cp .env.example .env

          set -o allexport
          source .env
          set +o allexport

          while IFS= read -r line; do
            if [[ "$line" != "" && "$line" != \#* ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .env

      - name: 🧪 Run Unit Tests
        if: ${{ inputs.run_tests == true }}
        working-directory: ripea
        run: mvn test

      - name: 🧱 Build EAR (Maven)
        working-directory: ripea
        run: |
          mvn -B clean package -DskipTests=true

      - name: 📝 Generate Release Notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MILESTONE=$(echo "${{ inputs.branch }}" | sed 's/-dev//')
          echo "Milestone: $MILESTONE"

          ISSUES=$(gh issue list -R ${{ inputs.repo }} -m "$MILESTONE" -s closed --json number,title --template '{{range .}}* [#{{.number}}] {{.title}}{{"\n"}}{{end}}')

          {
            echo "notes<<EOF"
            echo "### 🚀 Associated Issues ($MILESTONE)"
            if [ -z "$ISSUES" ]; then
              echo "No closed issues found for this milestone."
            else
              echo "$ISSUES"
            fi
            echo ""
            echo "---"
            echo "Built from branch: \`${{ inputs.branch }}\`"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 📦 Upload EAR artifact
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Ripea EAR ${{ steps.package_version.outputs.version }}"
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.release_notes.outputs.notes }}
          files: ripea/ripea-ear/target/*.ear
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Quay
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | docker login ${{ secrets.QUAY_URL }} \
            -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: 🐳 Build Docker image
        if: ${{ inputs.build_docker == 'true' }}
        working-directory: ripea
        env:
          BASE_IMAGE: ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/jboss:eap72-openjdk11-rhel8
        run: |
          docker build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:${{ steps.vars.outputs.tag }} \
            -t ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:latest \
            .

      - name: 📤 Push Docker image
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:latest