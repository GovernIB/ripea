name: 🚀 Build RIPEA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '📦 Repository'
        default: 'GovernIB/ripea'
        required: true
      branch:
        description: '🌿 Branch'
        default: 'ripea-1.0-dev'
        required: true
      skip_tests:
        description: '🧪 Skip tests'
        type: choice
        options: ['true', 'false']
        default: 'false'
      build_docker:
        description: '🐳 Build Docker image'
        type: choice
        options: ['true', 'false']
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔧 Set variables
        id: vars
        run: |
          TAG="manual-${{ inputs.branch }}-$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🌐 Clone repository
        run: |
          git clone --branch ${{ inputs.branch }} --depth 1 https://github.com/${{ inputs.repo }} ripea

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: 📄 Load .env variables
        working-directory: ripea
        run: |
          cp .env.example .env

          set -o allexport
          source .env
          set +o allexport

          while IFS= read -r line; do
            if [[ "$line" != "" && "$line" != \#* ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .env

      - name: 🧱 Build EAR (Maven)
        working-directory: ripea
        run: |
          mvn -B clean package \
            -DskipTests=${{ inputs.skip_tests }}

      - name: 📦 Upload EAR artifact
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "RIPEA EAR ${{ steps.vars.outputs.tag }}"
          body: "EAR build for branch ${{ inputs.branch }}"
          files: ripea/target/*.ear
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # DOCKER BUILD (Dockerfile)
      # =========================

      - name: 🔐 Login to Quay
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | docker login ${{ secrets.QUAY_URL }} \
            -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: 🐳 Build Docker image
        if: ${{ inputs.build_docker == 'true' }}
        working-directory: ripea
        env:
          BASE_IMAGE: ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/jboss:eap72-openjdk11-rhel8
        run: |
          docker build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/:${{ steps.vars.outputs.tag }} \
            -t ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/latest \
            .

      - name: 📤 Push Docker image
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/:${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/latest
      - name: 📤 Push Docker image
        if: ${{ inputs.build_docker == 'true' }}
        run: |
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.QUAY_URL }}/${{ secrets.ORGANIZATION }}/ripea:latest
