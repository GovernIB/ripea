name: 🚀 Build RIPEA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '📦 Repository'
        default: 'GovernIB/ripea'
        required: true

      branch:
        description: '🌿 Branch'
        default: 'ripea-1.0-dev'
        required: true

      run_tests:
        description: '🧪 Run tests'
        type: boolean
        default: false

      build_docker:
        description: '🐳 Push Docker image'
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: 🔧 Set variables
        id: vars
        run: |
          OWNER=$(echo "${{ inputs.repo }}" | cut -d '/' -f1)
          REPO=$(echo "${{ inputs.repo }}" | cut -d '/' -f2)

          IMAGE_NAME="${OWNER}/${REPO}/ripea-ear"

          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: 🌐 Clone repository
        run: |
          git clone \
            --branch ${{ inputs.branch }} \
            --depth 1 \
            https://github.com/${{ inputs.repo }} \
            ripea

      - name: ☕ Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: 🏷️ Get Maven version + build version
        id: package_version
        working-directory: ripea
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout \
            -f ripea-ear/pom.xml)

          BUILD_VERSION="${VERSION}-build${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

          echo "Maven version: $VERSION"
          echo "Build version: $BUILD_VERSION"

      - name: 📄 Load .env variables
        working-directory: ripea
        run: |
          cp .env.example .env

          set -o allexport
          source .env
          set +o allexport

          while IFS= read -r line; do
            if [[ "$line" != "" && "$line" != \#* ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .env

      - name: 🧪 Run Unit Tests
        if: ${{ inputs.run_tests == true }}
        working-directory: ripea
        run: mvn test

      - name: 🧱 Build EAR (Maven)
        working-directory: ripea
        run: mvn -B clean package -DskipTests=true

      - name: 🔐 Login to Docker Hub
        if: ${{ inputs.build_docker == true }}
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: 🐳 Build Docker image
        if: ${{ inputs.build_docker == true }}
        working-directory: ripea
        env:
          BASE_IMAGE: ${{ secrets.DOCKER_BASE_IMAGE }}
        run: |
          echo "Using base image: $BASE_IMAGE"

          docker build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t ${{ steps.vars.outputs.image_name }}:${{ steps.package_version.outputs.build_version }} \
            -t ${{ steps.vars.outputs.image_name }}:latest \
            .

      - name: 📤 Push Docker image
        if: ${{ inputs.build_docker == true }}
        run: |
          docker push ${{ steps.vars.outputs.image_name }}:${{ steps.package_version.outputs.build_version }}
          docker push ${{ steps.vars.outputs.image_name }}:latest

      - name: 💾 Save Docker image
        if: ${{ inputs.build_docker == true }}
        run: |
          docker save \
            ${{ steps.vars.outputs.image_name }}:${{ steps.package_version.outputs.build_version }} \
            ${{ steps.vars.outputs.image_name }}:latest \
            | gzip > ripea-docker-image.tar.gz

      - name: 📝 Generate Release Notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MILESTONE=$(echo "${{ inputs.branch }}" | sed 's/-dev//')

          ISSUES=$(gh issue list \
            -R ${{ inputs.repo }} \
            -m "$MILESTONE" \
            -s closed \
            --json number,title \
            --template '{{range .}}* [#{{.number}}] {{.title}}{{"\n"}}{{end}}')

          {
            echo "notes<<EOF"
            echo "### 🚀 Build info"
            echo "- Version: ${{ steps.package_version.outputs.version }}"
            echo "- Build: ${{ steps.package_version.outputs.build_version }}"
            echo "- Branch: ${{ inputs.branch }}"
            echo ""
            echo "### 📌 Issues"

            if [ -z "$ISSUES" ]; then
              echo "No issues found."
            else
              echo "$ISSUES"
            fi

            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 📦 Upload EAR Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package_version.outputs.build_version }}
          name: "RIPEA ${{ steps.package_version.outputs.build_version }}"
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.release_notes.outputs.notes }}
          files: ripea/ripea-ear/target/*.ear
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Upload Docker image to Release
        if: ${{ inputs.build_docker == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package_version.outputs.build_version }}
          files: ripea-docker-image.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
