name: 🚀 Build & Release RIPEA EAR + Docker

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '📦 Repositori'
        default: 'GovernIB/ripea'
        required: true
      branch:
        description: '🌿 Branca'
        default: 'ripea-1.0-dev'
        required: true
      skip_tests:
        description: '🧪 Executar proves'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

permissions:
  contents: write
  packages: write   # 🔥 necesario para GHCR

jobs:
  build-and-release:
    name: 🏗️ Compilar EAR i Docker
    runs-on: ubuntu-latest

    steps:
      - name: 🔧 Resoldre paràmetres
        id: vars
        run: |
          echo "repo=${{ inputs.repo }}" >> $GITHUB_OUTPUT
          echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          echo "skip_tests=${{ inputs.skip_tests }}" >> $GITHUB_OUTPUT

          TAG="manual-${{ inputs.branch }}-$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          IMAGE="ghcr.io/${{ github.repository }}/ripea:$TAG"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: 🌐 Clonar repositori
        run: |
          git clone --branch ${{ steps.vars.outputs.branch }} --depth 1 https://github.com/${{ steps.vars.outputs.repo }} ripea

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 🧱 Compilar EAR
        working-directory: ripea
        run: |
          mvn -B clean package \
            -DskipTests=${{ steps.vars.outputs.skip_tests }} \
            -Dviavansi.repo.skip=true

      - name: 🧪 Executar proves
        working-directory: ripea
        if: ${{ steps.vars.outputs.skip_tests == 'false' }}
        run: mvn test

      - name: 📦 Localitzar EAR
        id: ear
        run: |
          FILE=$(find ripea -type f -path "*/target/*.ear" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ No s'ha trobat cap fitxer EAR."
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "EAR trobat: $FILE"

      # 🔥 Copiar EAR al root (para Docker build)
      - name: 📁 Preparar EAR per Docker
        run: |
          cp ${{ steps.ear.outputs.file }} ripea.ear

      - name: 🚀 Crear Release i pujar EAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: RIPEA EAR ${{ steps.vars.outputs.branch }}
          body: |
            🧩 **Compilació manual de RIPEA**
            - Repositori: https://github.com/${{ steps.vars.outputs.repo }}
            - Branca: `${{ steps.vars.outputs.branch }}`
            - Artefacte: `.ear`
            - Build: ${{ github.run_id }}
            - Data: ${{ github.run_started_at }}
          files: ${{ steps.ear.outputs.file }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login a Quay
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | docker login ${{ secrets.QUAY_URL }} -u ${{ github.actor }} --password-stdin

      - name: 🐳 Build imatge Docker
        run: |
          docker build -t ${{ secrets.QUAY_URL }}:${{ steps.vars.outputs.tag }} .

      - name: 📤 Push imatge Docker a Quay
        run: |
          docker push ${{ secrets.QUAY_URL }}:${{ steps.vars.outputs.tag }}

      - name: ✅ Tot publicat
        run: |
          echo "🎉 EAR i imatge Docker publicats"
          echo "🐳 Imatge: ${{ secrets.QUAY_URL }}:${{ steps.vars.outputs.tag }}"
