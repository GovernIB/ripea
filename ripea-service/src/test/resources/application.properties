# -------------------------------------------------------
# Configuració de tests amb H2 en mode Oracle (in-memory)
# -------------------------------------------------------

# Datasource H2
spring.datasource.url=jdbc:h2:mem:ripeadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: generar l'esquema a partir de les entitats i esborrar-lo al final
spring.jpa.hibernate.ddl-auto=create-drop

# Dialect (requerit per AclConfig si es carregués; aquí informa H2)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Desactivar Liquibase als tests (l'esquema el genera Hibernate)
spring.liquibase.enabled=false

# Permetre que els beans de test sobreescriguin els de producció (si cal)
spring.main.allow-bean-definition-overriding=true

# Permetre referències circulars (existents al codi de producció, resoltes per Spring)
spring.main.allow-circular-references=true

# No iniciar el context web (tests de capa de servei, sense MVC)
spring.main.web-application-type=none

# Desactivar la configuració automàtica de JMS (gestionat per TestServiceConfig)
spring.jms.enabled=false

# Logging SQL (comentar per reduir soroll als tests)
spring.jpa.show-sql=false
